<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Bilbao Gastro{% endblock %}</title>
</head>

<body>

    <nav> <!-- barra de navegación para todas las páginas (la extienden desde su html) -->
        <a href="{% url 'index' %}">Inicio</a> |
        <a href="{% url 'lista_ciudades' %}">Ciudades</a> |
        <a href="{% url 'lista_restaurantes' %}">Restaurantes</a> |

    <hr>

</body>

</html>
