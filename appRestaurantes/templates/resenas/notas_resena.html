{# notas por categoría de una reseña ('resena'); solo se incluye si las tiene #}
<dl class="notas-resena">
    <div><dt>Comida</dt><dd>{{ resena.nota_comida }}<span>/5</span></dd></div>
    <div><dt>Servicio</dt><dd>{{ resena.nota_servicio }}<span>/5</span></dd></div>
    <div><dt>Ambiente</dt><dd>{{ resena.nota_ambiente }}<span>/5</span></dd></div>
    <div><dt>Calidad-precio</dt><dd>{{ resena.nota_calidad_precio }}<span>/5</span></dd></div>
</dl>
